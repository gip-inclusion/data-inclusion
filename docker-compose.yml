x-airflow-common:
  &airflow-common

  image: data-inclusion/airflow
  build:
    context: pipeline

  environment:
    &airflow-common-environment
    AIRFLOW__API_AUTH__JWT_SECRET: USE_IN_DEVELOPMENT_ONLY
    AIRFLOW__API__SECRET_KEY: USE_IN_DEVELOPMENT_ONLY
    AIRFLOW__API__WORKERS:
    AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: 24
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW__CORE__DEFAULT_TIMEZONE}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__MAX_MAP_LENGTH: 2048
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: 60
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: 4
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY: 0
    # Connections
    AIRFLOW_CONN_PG: postgresql://data-inclusion:data-inclusion@datawarehouse:5432/data-inclusion
    AIRFLOW_CONN_S3: '{"conn_type": "aws", "extra": {"endpoint_url": "http://datalake:8333", "aws_access_key_id": "${AWS_ACCESS_KEY_ID}", "aws_secret_access_key": "${AWS_SECRET_ACCESS_KEY}", "service_config": {"s3": {"bucket_name": "${DATALAKE_BUCKET_NAME}"}}}}'

    # Variables
    AIRFLOW_VAR_ANTHROPIC_API_KEY: ${AIRFLOW_VAR_ANTHROPIC_API_KEY}
    AIRFLOW_VAR_BREVO_API_KEY: ${AIRFLOW_VAR_BREVO_API_KEY}
    AIRFLOW_VAR_CARIF_OREF_URL: ${AIRFLOW_VAR_CARIF_OREF_URL}
    AIRFLOW_VAR_DATAGOUV_API_KEY: ${AIRFLOW_VAR_DATAGOUV_API_KEY}
    AIRFLOW_VAR_DORA_API_TOKEN: ${AIRFLOW_VAR_DORA_API_TOKEN}
    AIRFLOW_VAR_FREDO_API_TOKEN: ${AIRFLOW_VAR_FREDO_API_TOKEN}
    AIRFLOW_VAR_FT_API_TOKEN: ${AIRFLOW_VAR_FT_API_TOKEN}
    AIRFLOW_VAR_GRIST_API_TOKEN: ${AIRFLOW_VAR_GRIST_API_TOKEN}
    AIRFLOW_VAR_MISSION_LOCALE_API_SECRET: ${AIRFLOW_VAR_MISSION_LOCALE_API_SECRET}
    AIRFLOW_VAR_MLFLOW_TRACKING_URI: http://mlflow:5000
    AIRFLOW_VAR_DORA_PREPROD_API_TOKEN: ${AIRFLOW_VAR_DORA_PREPROD_API_TOKEN}
    AIRFLOW_VAR_EMPLOIS_API_TOKEN: ${AIRFLOW_VAR_EMPLOIS_API_TOKEN}
    AIRFLOW_VAR_MEDIATION_NUMERIQUE_API_TOKEN: ${AIRFLOW_VAR_MEDIATION_NUMERIQUE_API_TOKEN}
    AIRFLOW_VAR_SOLIGUIDE_API_TOKEN: ${AIRFLOW_VAR_SOLIGUIDE_API_TOKEN}
    AIRFLOW_VAR_MA_BOUSSOLE_AIDANTS_API_KEY: ${AIRFLOW_VAR_MA_BOUSSOLE_AIDANTS_API_KEY}
    AIRFLOW_VAR_ENVIRONMENT: test

  volumes:
    - ./pipeline/dbt:/opt/airflow/dbt
    - ./pipeline/dags:/opt/airflow/dags

  user: ${AIRFLOW_UID:-50000}:0

  depends_on:
    &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-db:
    image: postgres:18
    restart: no
    healthcheck:
      test: pg_isready
      interval: 5s
      retries: 5
    ports:
      - ${AIRFLOW_DB_PORT:-5454}:5432
    environment:
      - PGUSER=airflow
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    restart: no
    ports:
      - ${AIRFLOW_UI_PORT:-8080}:8080

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: no
    healthcheck:
      test: airflow jobs check --job-type DagProcessorJob --local
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: no
    healthcheck:
      test: airflow jobs check --job-type SchedulerJob --local
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    command: version
    restart: no
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: 'true'
    depends_on:
      airflow-db:
        condition: service_healthy

  datalake:
    image: chrislusf/seaweedfs:4.52
    command: mini -dir=/data
    restart: no
    ports:
      - 8333:8333  # s3 api
      - 8888:8888  # filer ui
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${DATALAKE_BUCKET_NAME}
    volumes:
      - datalake-data:/data

  datawarehouse:
    image: data-inclusion/datawarehouse
    build: datawarehouse
    restart: no
    command: -c fsync=off -c full_page_writes=off -c synchronous_commit=off -c log_statement=all
    healthcheck:
      test: pg_isready
      interval: 5s
      retries: 5
    ports:
      - ${TARGET_POSTGRES_PORT:-5433}:5432
    environment:
      - PGUSER=data-inclusion
      - POSTGRES_DB=data-inclusion
      - POSTGRES_USER=data-inclusion
      - POSTGRES_PASSWORD=data-inclusion
      - BREVO_API_KEY=${AIRFLOW_VAR_BREVO_API_KEY}
    volumes:
      - pg-data:/var/lib/postgresql

  api:
    image: data-inclusion/api
    build: api
    depends_on:
      datawarehouse:
        condition: service_healthy
    restart: no
    ports:
      - ${API_PORT:-8000}:8000
    environment:
      - ENV=${API_ENV:-dev}
      - DEBUG=${API_DEBUG:-False}
      - DATABASE_URL=postgresql://data-inclusion:data-inclusion@datawarehouse:5432/diapi
      - BASE_URL=http://127.0.0.1:8000
      - SECRET_KEY=USE_IN_DEVELOPMENT_ONLY
      - AWS_ENDPOINT_URL=http://datalake:8333
      - DATALAKE_BUCKET_NAME=${DATALAKE_BUCKET_NAME}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}

  mlflow-db:
    image: postgres:18
    restart: no
    healthcheck:
      test: pg_isready
      interval: 5s
      retries: 5
    environment:
      - PGUSER=mlflow
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1-full
    depends_on:
      mlflow-db:
        condition: service_healthy
    command: mlflow server
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      - MLFLOW_DISABLE_TELEMETRY=True
      - MLFLOW_SERVER_ALLOWED_HOSTS=localhost:5000,mlflow:5000
    ports:
      - 5000:5000

volumes:
  pg-data:
  datalake-data:

networks:
  default:
    name: data-inclusion
