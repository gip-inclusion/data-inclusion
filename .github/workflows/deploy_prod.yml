name: deploy_prod

on:
  push:
    branches: [release]

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build_images.yml

  deploy_prod:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_terraform_deploy.yml
    secrets: inherit
    with:
      environment: prod
