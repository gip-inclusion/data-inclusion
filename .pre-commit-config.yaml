repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ambr$

  # api
  - repo: local
    hooks:
      - id: api-ruff-format
        name: api|ruff-format
        entry: uv run --project api --frozen ruff format --config=api/pyproject.toml
        language: system
        files: ^api
        types_or: [python]
      - id: api-ruff-check
        name: api|ruff-check
        entry: uv run --project api --frozen ruff check --config=api/pyproject.toml --fix --fixable=I
        language: system
        files: ^api
        types_or: [python]
      - id: api-djlint-reformat
        name: api|djlint-reformat
        entry: uv run --project api --frozen djlint --configuration=api/pyproject.toml --profile=jinja --reformat
        language: system
        files: ^api
        types_or: [html]
      - id: api-djlint-lint
        name: api|djlint-lint
        entry: uv run --project api --frozen djlint --configuration=api/pyproject.toml --profile=jinja --lint
        language: system
        files: ^api
        types_or: [html]

  # deployment
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        name: deployment|terraform-fmt
        files: ^deployment/

  # pipeline
  - repo: local
    hooks:
      - id: pipeline-ruff-format
        name: pipeline|ruff-format
        entry: uv run --project pipeline --no-sync ruff format --config=pipeline/pyproject.toml
        language: system
        files: ^pipeline
        types_or: [python,json]
      - id: pipeline-ruff-check
        name: pipeline|ruff-check
        entry: uv run --project pipeline --no-sync ruff check --config=pipeline/pyproject.toml --fix --fixable=I
        language: system
        files: ^pipeline
        types_or: [python]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.5.0
    hooks:
      - id: sqlfluff-fix
        name: pipeline|sqlfluff-fix
        files: ^pipeline
        types: [sql]
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-core
          - dbt-postgres
        args:
          - --config=./pipeline/pyproject.toml

  - repo: local
    hooks:
      # lock files are always recompiled (needs PyPI access); constraints.txt is only
      # refetched when Dockerfile/Makefile look newer, CI (--always-make) is the authoritative check
      - id: pipeline-requirements
        name: pipeline|requirements
        entry: make -C pipeline/requirements all
        language: system
        pass_filenames: false
        files: ^pipeline/(Dockerfile|\.python-version|pyproject\.toml|requirements/)
