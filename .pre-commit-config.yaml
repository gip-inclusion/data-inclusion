repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ambr$

  # api
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        name: api|ruff-format
        args: [--config=api/pyproject.toml]
        files: ^api
        types_or: [python]
      - id: ruff
        name: api|ruff-check
        args:
          - --config=api/pyproject.toml
          - --fix
          - --fixable=I
        files: ^api
        types_or: [python]
  - repo: https://github.com/djlint/djLint
    rev: v1.49.10
    hooks:
      - id: djlint-reformat-jinja
        args: [--configuration=api/pyproject.toml]
        files: ^api
        types_or: [html]
      - id: djlint-jinja
        args: [--configuration=api/pyproject.toml]
        files: ^api
        types_or: [html]

  # deployment
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        name: deployment|terraform-fmt
        files: ^deployment/

  # pipeline
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        name: pipeline|ruff-format
        args: [--config=pipeline/pyproject.toml]
        files: ^pipeline
        types_or: [python,json]
      - id: ruff
        name: pipeline|ruff-check
        args:
          - --config=pipeline/pyproject.toml
          - --fix
          - --fixable=I
        files: ^pipeline
        types_or: [python]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-fix
        name: pipeline|sqlfluff-fix
        files: ^pipeline
        types: [sql]
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-core
          - dbt-postgres
        args:
          - --config=./pipeline/pyproject.toml

  - repo: local
    hooks:
      # lock files are always recompiled (needs PyPI access); constraints.txt is only
      # refetched when Dockerfile/Makefile look newer, CI (--always-make) is the authoritative check
      - id: pipeline-requirements
        name: pipeline|requirements
        entry: make -C pipeline/requirements all
        language: system
        pass_filenames: false
        files: ^pipeline/(Dockerfile|\.python-version|pyproject\.toml|requirements/)
